services:
  db:
    image: postgres:16-alpine
    container_name: mini-rewards-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rewards
      POSTGRES_PASSWORD: rewards
      POSTGRES_DB: rewards
    ports:
      # 5433 on the host, not 5432: a developer reviewing this probably already
      # has Postgres running locally, and a port clash on first `docker compose
      # up` is an avoidable way to lose ten minutes.
      - '5433:5432'
    volumes:
      - rewards-db-data:/var/lib/postgresql/data
    healthcheck:
      # `pnpm db:migrate` immediately after `db:up` races the server's startup,
      # so the container reports unhealthy until Postgres actually accepts
      # connections rather than merely having a running process.
      test: ['CMD-SHELL', 'pg_isready -U rewards -d rewards']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rewards-db-data:
