packages:
  - 'packages/*'

# pnpm refuses to run dependency lifecycle scripts unless they are approved
# here. Prisma's postinstall is what generates the typed client, and esbuild
# fetches its platform binary on install. Without these, `pnpm install` reports
# success but leaves an unusable toolchain behind an interactive prompt, which
# is a miserable first five minutes for anyone cloning this repo.
#
# (The key is `allowBuilds` on pnpm 11+; it was `onlyBuiltDependencies` on 10.)
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true

# The API package runs `prisma generate` in its own postinstall. Without it, a
# fresh clone installs cleanly and then fails on `Cannot find module
# '.prisma/client/default'` the first time anything imports the client — which
# reads as a broken repository rather than a missing build step.
#
# It runs before `.env` exists, which is fine: generate reads the schema, not
# the database, and does not need DATABASE_URL resolved.
